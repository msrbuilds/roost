name: Website and docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: roost-public-website
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    # The locked Playwright release supports Ubuntu 24.04; latest may move.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: cloudflare-pages
      url: https://roost.msrbuilds.com
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: website/.node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            website/package-lock.json
      - name: Install dependencies
        run: |
          npm ci
          npm --prefix website ci
          npx playwright install --with-deps chromium
      - name: Build website and shared guides
        run: npm --prefix website run build
      - name: Test built website
        run: npm run test:website
      - name: Publish to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.160.1 pages deploy website/dist --project-name=roost-msrbuilds --branch=main --commit-hash="$GITHUB_SHA"
      - name: Verify published commit
        env:
          WEBSITE_BASE_URL: https://roost.msrbuilds.com
        run: node website/scripts/verify-deployment.mjs
      - name: Test public website and docs
        env:
          WEBSITE_BASE_URL: https://roost.msrbuilds.com
        run: npm run test:website
