resolver 127.0.0.11 valid=10s ipv6=off;

# The demo is a separate, synthetic database. Enforce read-only access here,
# including direct API calls; hiding buttons alone cannot protect a shared login.
# PostgREST's read-only functions use POST, so allow only these named functions.
map "$request_method:$uri" $demo_write_blocked {
    default 1;
    ~^(GET|HEAD|OPTIONS): 0;
    "POST:/auth/v1/token" 0;
    "POST:/auth/v1/logout" 0;
    ~^POST:/rest/v1/rpc/(get_user_rank|has_premium_access|can_access_group|search_users|get_remaining_activations|has_active_request|has_active_subscription)$ 0;
}
map $uri $demo_rpc_allowed {
    default 1;
    ~^/rest/v1/rpc/(get_user_rank|has_premium_access|can_access_group|search_users|get_remaining_activations|has_active_request|has_active_subscription)$ 1;
    ~^/rest/v1/rpc/ 0;
}

server {
    listen 80;
    server_name _;
    if ($demo_write_blocked) { return 403 '{"error":"This shared demo is read-only. Create your own Roost community to make changes."}'; }
    if ($demo_rpc_allowed = 0) { return 403 '{"error":"This function is unavailable in the read-only demo."}'; }
    client_max_body_size 100m;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    set $frontend_upstream frontend;
    set $backend_upstream backend;
    set $kong_upstream kong;
    set $minio_upstream minio;

    location /api/ {
        proxy_pass http://$backend_upstream:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
    location /auth/ {
        proxy_pass http://$kong_upstream:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /rest/ {
        proxy_pass http://$kong_upstream:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /realtime/ {
        proxy_pass http://$kong_upstream:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
    location /storage/ {
        proxy_pass http://$kong_upstream:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        proxy_pass http://$frontend_upstream:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
